# 宿主机 Nginx 反向代理配置
# 放到 /etc/nginx/conf.d/xianyu.conf，把 YOUR_DOMAIN 全部替换为实际域名，然后：
#   sudo sed -i 's/YOUR_DOMAIN/你的域名/g' /etc/nginx/conf.d/xianyu.conf
#   sudo certbot --nginx -d 你的域名
#   sudo nginx -t && sudo systemctl reload nginx
#
# 与仓库自带 nginx/nginx.conf 的区别：
#   - 默认只提供 HTTPS，HTTP 仅用于 ACME 校验与跳转
#   - WebSocket / SSE 长连接超时放宽到 1 小时并关闭 proxy_buffering（原配置 30s 会掐断实时消息）
#   - 增加登录限流与更完整的安全响应头

limit_req_zone $binary_remote_addr zone=xianyu_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 50M;
    access_log /var/log/nginx/xianyu.access.log;
    error_log  /var/log/nginx/xianyu.error.log warn;

    # 公共反代参数放在 server 上下文，由下面所有 location 继承
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;

    location = /login {
        limit_req zone=xianyu_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:9000;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
    }
}
